<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs><rect width="1100" height="500" fill="#f8fafc"/><path d="M260,210 L300,210" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="285.0" y="203.0" font-family="Arial" font-size="12">upload</text><path d="M520,210 L560,210" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="545.0" y="203.0" font-family="Arial" font-size="12">event/read</text><path d="M780,210 L820,210" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="805.0" y="203.0" font-family="Arial" font-size="12">write JSON</text><path d="M670,115 L670,170" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="675.0" y="135.5" font-family="Arial" font-size="12">permissions</text><path d="M670,250 L930,340" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="805.0" y="288.0" font-family="Arial" font-size="12">PutItem</text><path d="M670,250 L410,340" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="545.0" y="288.0" font-family="Arial" font-size="12">logs</text><path d="M670,250 L670,340" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="675.0" y="288.0" font-family="Arial" font-size="12">Errors metric</text><rect x="40" y="170" width="220" height="80" rx="10" fill="#e0f2fe" stroke="#0369a1"/><text x="150" y="202" text-anchor="middle" font-family="Arial" font-size="17">User / CloudShell</text><text x="150" y="227" text-anchor="middle" font-family="Arial" font-size="11">Upload UTF-8 .txt</text><rect x="300" y="170" width="220" height="80" rx="10" fill="#e0f2fe" stroke="#0369a1"/><text x="410" y="202" text-anchor="middle" font-family="Arial" font-size="17">S3 input bucket</text><text x="410" y="227" text-anchor="middle" font-family="Arial" font-size="11">Private, encrypted, HTTPS</text><rect x="560" y="170" width="220" height="80" rx="10" fill="#e0f2fe" stroke="#0369a1"/><text x="670" y="202" text-anchor="middle" font-family="Arial" font-size="17">Lambda word counter</text><text x="670" y="227" text-anchor="middle" font-family="Arial" font-size="11">Automatic serverless scaling</text><rect x="820" y="170" width="220" height="80" rx="10" fill="#e0f2fe" stroke="#0369a1"/><text x="930" y="202" text-anchor="middle" font-family="Arial" font-size="17">S3 results bucket</text><text x="930" y="227" text-anchor="middle" font-family="Arial" font-size="11">JSON output with project name</text><rect x="560" y="35" width="220" height="80" rx="10" fill="#e0f2fe" stroke="#0369a1"/><text x="670" y="67" text-anchor="middle" font-family="Arial" font-size="17">IAM execution role</text><text x="670" y="92" text-anchor="middle" font-family="Arial" font-size="11">Only input/read, results/write, logs</text><rect x="820" y="340" width="220" height="80" rx="10" fill="#e0f2fe" stroke="#0369a1"/><text x="930" y="372" text-anchor="middle" font-family="Arial" font-size="17">DynamoDB results</text><text x="930" y="397" text-anchor="middle" font-family="Arial" font-size="11">On-demand, source_file key</text><rect x="300" y="340" width="220" height="80" rx="10" fill="#e0f2fe" stroke="#0369a1"/><text x="410" y="372" text-anchor="middle" font-family="Arial" font-size="17">CloudWatch logs</text><text x="410" y="397" text-anchor="middle" font-family="Arial" font-size="11">7-day retention</text><rect x="560" y="340" width="220" height="80" rx="10" fill="#e0f2fe" stroke="#0369a1"/><text x="670" y="372" text-anchor="middle" font-family="Arial" font-size="17">CloudWatch error alarm</text><text x="670" y="397" text-anchor="middle" font-family="Arial" font-size="11">Errors &gt;= 1 in 5 minutes</text><rect x="40" y="35" width="220" height="80" rx="10" fill="#e0f2fe" stroke="#0369a1"/><text x="150" y="67" text-anchor="middle" font-family="Arial" font-size="17">CloudFormation</text><text x="150" y="92" text-anchor="middle" font-family="Arial" font-size="11">Defines all AWS resources</text><text x="40" y="465" font-family="Arial" font-size="14">CloudFormation provisions every AWS component. IAM grants Lambda access only to this project.</text><text x="40" y="488" font-family="Arial" font-size="14">Separate input/output buckets prevent recursive processing. Alarm is visible in AWS; no email subscription configured.</text></svg>